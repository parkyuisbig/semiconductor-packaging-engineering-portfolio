<text class="small" x="70" y="137">Lower vacuum absolute pressure</text>
<text class="small" x="315" y="137">residual gas/void risk 감소</text>
<text class="small" x="575" y="136">evacuation time, pump load, volatile/outgassing </text>
<text class="small" x="575" y="157">response 변화</text>
<text class="tick" x="70" y="167">Check: Cycle Time Index와 raw vacuum trace 동시 비교</text>
<rect x="55" y="204" width="890" height="76" rx="6" fill="#EFF6FF" stroke="#CBD5E1"/>
<text class="small" x="70" y="229">Smaller heater-zone range</text>
<text class="small" x="315" y="229">viscosity/cure spatial uniformity 향상</text>
<text class="small" x="575" y="228">zone tuning 과정의 thermal lag 또는 local cure 차이</text>
<text class="tick" x="70" y="259">Check: Warpage와 edge/center coupon temperature</text>
<rect x="55" y="296" width="890" height="76" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
