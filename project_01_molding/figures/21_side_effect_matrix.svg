<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.axis{stroke:#94A3B8;stroke-width:1}.grid{stroke:#E2E8F0;stroke-width:1}.small{font-size:13px}.tick{font-size:12px;fill:#475569}.label{font-size:15px;font-weight:600}.title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#64748B}</style>
<text class="title" x="105" y="38">Improvement versus side-effect matrix</text>
<text class="subtitle" x="105" y="59">Engineering trade-offs that remain before real-equipment confirmation</text>
<text class="label" x="70" y="90">Change</text>
<text class="label" x="315" y="90">Primary benefit</text>
<text class="label" x="575" y="90">Possible side effect</text>
